[project]
name = "sourced"
version = "0.1.0"
description = "Product intelligence for industrial commerce — enrichment with verified provenance and calibrated abstention"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pdfplumber>=0.11",
    "pint>=0.24",
    "rapidfuzz>=3.10",
    "rank_bm25>=0.2.2",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "anthropic>=0.40",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sourced*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
